# Workflow for deploying the status.ankimcp.ai status page to Cloudflare Workers
name: Deploy status page

on:
  push:
    branches:
      - main
    paths:
      - "status/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-status"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: status
          wranglerVersion: "4.127.1"
          command: deploy
