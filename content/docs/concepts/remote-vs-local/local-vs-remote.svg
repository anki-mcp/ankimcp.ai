<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="lvr-title lvr-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="lvr-title">Local vs remote access</title>
  <desc id="lvr-desc">Two panels. Local: an AI app and Anki run on the same computer and talk over localhost, free, nothing leaves the machine. Remote: a web or mobile AI in the cloud reaches Anki on your computer through the secure AnkiMCP tunnel after signing in.</desc>

  <defs>
    <marker id="lvr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#667085"/>
    </marker>
    <marker id="lvr-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#fcfcfd" stroke="#e4e7ec"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2939">Two ways your AI reaches Anki</text>

  <!-- divider -->
  <line x1="320" y1="52" x2="320" y2="330" stroke="#e4e7ec" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== LEFT: LOCAL ===== -->
  <text x="160" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2939">Local — same computer</text>
  <rect x="130" y="76" width="60" height="18" rx="9" fill="#ecfdf3" stroke="#12b76a"/>
  <text x="160" y="89" text-anchor="middle" font-size="11" font-weight="600" fill="#027a48">Free</text>

  <!-- computer outline -->
  <rect x="42" y="104" width="236" height="196" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="1.5"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#667085">Your computer</text>

  <!-- AI app box -->
  <rect x="62" y="132" width="196" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="160" y="153" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2939">AI app</text>
  <text x="160" y="170" text-anchor="middle" font-size="11" fill="#667085">Claude Desktop · Cursor · Zed</text>

  <!-- localhost arrows -->
  <line x1="150" y1="192" x2="150" y2="224" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#lvr-arrow-blue)"/>
  <line x1="170" y1="224" x2="170" y2="192" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#lvr-arrow-blue)"/>
  <text x="186" y="212" font-size="10.5" fill="#667085">localhost</text>

  <!-- Anki box -->
  <rect x="62" y="230" width="196" height="52" rx="8" fill="#ffffff" stroke="#98a2b3"/>
  <text x="160" y="251" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2939">Anki</text>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#667085">with the AnkiMCP add-on or CLI</text>

  <text x="160" y="324" text-anchor="middle" font-size="11.5" fill="#475467">Nothing ever leaves your computer</text>

  <!-- ===== RIGHT: REMOTE ===== -->
  <text x="480" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2939">Remote — managed tunnel</text>
  <rect x="435" y="76" width="90" height="18" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="480" y="89" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Free &amp; paid</text>

  <!-- cloud AI box -->
  <rect x="382" y="104" width="196" height="52" rx="26" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="480" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2939">Web &amp; mobile AI</text>
  <text x="480" y="142" text-anchor="middle" font-size="11" fill="#667085">ChatGPT · claude.ai · your phone</text>

  <!-- arrows cloud <-> tunnel -->
  <line x1="470" y1="156" x2="470" y2="184" stroke="#667085" stroke-width="1.5" marker-end="url(#lvr-arrow)"/>
  <line x1="490" y1="184" x2="490" y2="156" stroke="#667085" stroke-width="1.5" marker-end="url(#lvr-arrow)"/>

  <!-- tunnel pill -->
  <rect x="392" y="188" width="176" height="34" rx="17" fill="#1d2939"/>
  <text x="480" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">AnkiMCP tunnel</text>
  <text x="480" y="217" text-anchor="middle" font-size="9" fill="#98a2b3">secure · sign-in required</text>

  <!-- arrows tunnel <-> anki -->
  <line x1="470" y1="226" x2="470" y2="254" stroke="#667085" stroke-width="1.5" marker-end="url(#lvr-arrow)"/>
  <line x1="490" y1="254" x2="490" y2="226" stroke="#667085" stroke-width="1.5" marker-end="url(#lvr-arrow)"/>

  <!-- anki on computer box -->
  <rect x="382" y="258" width="196" height="44" rx="8" fill="#ffffff" stroke="#98a2b3"/>
  <text x="480" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2939">Anki on your computer</text>
  <text x="480" y="292" text-anchor="middle" font-size="11" fill="#667085">add-on or CLI keeps it connected</text>

  <text x="480" y="324" text-anchor="middle" font-size="11.5" fill="#475467">Works from any device, anywhere</text>
</svg>
