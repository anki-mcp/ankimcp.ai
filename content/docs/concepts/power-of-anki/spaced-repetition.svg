<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="sr-title sr-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="sr-title">Spaced repetition flattens the forgetting curve</title>
  <desc id="sr-desc">Each review resets memory to full and the next decline is slower, so retention stays high over time. Without review, memory falls to near zero within days.</desc>

  <!-- PLACEHOLDER CHART: hand-drawn SVG, to be replaced with a designed image later -->
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#fcfcfd" stroke="#e4e7ec"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2939">How each review flattens the curve</text>

  <!-- gridlines + y-axis labels -->
  <g stroke="#eaecf0" stroke-width="1">
    <line x1="60" y1="30"  x2="620" y2="30"/>
    <line x1="60" y1="100" x2="620" y2="100"/>
    <line x1="60" y1="170" x2="620" y2="170"/>
    <line x1="60" y1="240" x2="620" y2="240"/>
    <line x1="60" y1="310" x2="620" y2="310"/>
  </g>
  <g font-size="12" fill="#667085" text-anchor="end">
    <text x="50" y="34">100%</text>
    <text x="50" y="104">75%</text>
    <text x="50" y="174">50%</text>
    <text x="50" y="244">25%</text>
    <text x="50" y="314">0%</text>
  </g>

  <!-- axes -->
  <line x1="60" y1="30" x2="60" y2="310" stroke="#98a2b3" stroke-width="1.5"/>
  <line x1="60" y1="310" x2="620" y2="310" stroke="#98a2b3" stroke-width="1.5"/>
  <text x="340" y="352" text-anchor="middle" font-size="13" fill="#475467">Time &#8594;</text>
  <text x="18" y="170" text-anchor="middle" font-size="13" fill="#475467" transform="rotate(-90 18 170)">Memory retained</text>

  <!-- "without review" decay, faint dashed for contrast -->
  <polyline fill="none" stroke="#f97066" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"
    points="60,30 78.7,140.2 97.3,207 116,247.5 134.7,272 172,296 246.7,308 620,309.6"/>

  <!-- spaced repetition sawtooth: each review resets to 100%, slower decay each time -->
  <polyline fill="none" stroke="#12b76a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="60,30 69.3,91.6 97.3,142 97.3,30 116,77.6 172,114 172,30 209.3,63.6 302.7,91.6 302.7,30 358.7,52.4 489.3,69.2 489.3,30 564,44 620,52.4"/>

  <!-- review markers -->
  <g fill="#12b76a">
    <circle cx="97.3"  cy="30" r="4"/>
    <circle cx="172"   cy="30" r="4"/>
    <circle cx="302.7" cy="30" r="4"/>
    <circle cx="489.3" cy="30" r="4"/>
  </g>
  <text x="180" y="22" font-size="11.5" fill="#027a48">&#9679; = a review</text>

  <!-- legend -->
  <g font-size="12.5">
    <line x1="350" y1="276" x2="378" y2="276" stroke="#12b76a" stroke-width="3"/>
    <text x="384" y="280" fill="#475467">With spaced review (Anki)</text>
    <line x1="350" y1="296" x2="378" y2="296" stroke="#f97066" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="384" y="300" fill="#475467">Without review</text>
  </g>
</svg>
