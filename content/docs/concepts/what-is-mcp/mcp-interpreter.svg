<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="mcpd-title mcpd-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="mcpd-title">The MCP server works like an interpreter</title>
  <desc id="mcpd-desc">Three boxes connected by arrows in both directions: the AI assistant on the left speaks plain language, the MCP server in the middle translates both ways, and Anki on the right performs the actions.</desc>

  <defs>
    <marker id="mcpd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#667085"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="638" height="278" rx="12" fill="#fcfcfd" stroke="#e4e7ec"/>

  <text x="320" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2939">The MCP server works like an interpreter</text>

  <!-- request example, flowing left to right -->
  <text x="122" y="82" text-anchor="middle" font-size="11" font-style="italic" fill="#475467">&#8220;Make 5 Spanish cards&#8221;</text>
  <text x="518" y="82" text-anchor="middle" font-size="11" font-style="italic" fill="#475467">cards appear in your deck</text>

  <!-- AI assistant box -->
  <rect x="42" y="100" width="160" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="122" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d2939">AI assistant</text>
  <text x="122" y="150" text-anchor="middle" font-size="11" fill="#667085">Claude · ChatGPT · Cursor</text>

  <!-- arrows AI <-> MCP -->
  <line x1="210" y1="125" x2="232" y2="125" stroke="#667085" stroke-width="1.5" marker-end="url(#mcpd-arrow)"/>
  <line x1="232" y1="147" x2="210" y2="147" stroke="#667085" stroke-width="1.5" marker-end="url(#mcpd-arrow)"/>

  <!-- MCP server box -->
  <rect x="240" y="100" width="160" height="70" rx="10" fill="#1d2939"/>
  <text x="320" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">MCP server</text>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="#98a2b3">the interpreter</text>

  <!-- arrows MCP <-> Anki -->
  <line x1="408" y1="125" x2="430" y2="125" stroke="#667085" stroke-width="1.5" marker-end="url(#mcpd-arrow)"/>
  <line x1="430" y1="147" x2="408" y2="147" stroke="#667085" stroke-width="1.5" marker-end="url(#mcpd-arrow)"/>

  <!-- Anki box -->
  <rect x="438" y="100" width="160" height="70" rx="10" fill="#ffffff" stroke="#98a2b3"/>
  <text x="518" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d2939">Anki</text>
  <text x="518" y="150" text-anchor="middle" font-size="11" fill="#667085">your flashcards</text>

  <!-- role captions -->
  <text x="122" y="196" text-anchor="middle" font-size="11" fill="#667085">speaks plain language</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#667085">translates both ways</text>
  <text x="518" y="196" text-anchor="middle" font-size="11" fill="#667085">performs the actions</text>

  <!-- bottom takeaway -->
  <line x1="42" y1="218" x2="598" y2="218" stroke="#eaecf0" stroke-width="1"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" fill="#475467">One standard &#8220;plug&#8221; — the same idea works for files, calendars, and any app that speaks MCP</text>
</svg>
